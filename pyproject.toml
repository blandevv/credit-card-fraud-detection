[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Supervised machine learning pipeline for detecting credit card transaction fraud, following the CRISP-DM methodology."
authors = [
    {name = "Jacobo Blandón Castro",email = "jacoboblandon94@gmail.com"},
    {name = "Johan Antonio Peña López"}
]
# Upper bound required by ydata-profiling, which supports Python <3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.3.5",
    "scikit-learn>=1.9.1",
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "ydata-profiling>=4.18.4",
    # ydata-profiling imports pkg_resources, which was removed in setuptools 81.
    "setuptools<81",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.4,<5.0.0)"
]
